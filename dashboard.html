<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MantaMind Dashboard</title>
  <link rel="stylesheet" href="Styles/style.css" />
<link rel="stylesheet" href="Styles/nav.css" />
<link rel="stylesheet" href="Styles/dashboard.css" />

</head>
<body>

  <!-- Top Navigation Bar -->
  <header id="top-nav">
    <div id="nav-title">🧠 MantaMind</div>
    <button id="burger-btn">&#9776;</button>
  </header>

  <!-- Sidebar Menu -->
  <nav id="sidebar-menu" class="hidden">
  <ul>
    <li><a href="index.html">👋 Home</a></li>
    <li><a href="challenge.html">🎮 Challenge</a></li>
    <li><a href="profile.html">👤 Profile</a></li>
    <li><a href="wordlist.html">📖 Word List</a></li>
    <li><a href="settings.html">⚙️ Settings</a></li>
    <li><a href="#" id="logout-btn">🚪 Logout</a></li>
  </ul>
</nav>


  <!-- Dashboard Content -->
  <main class="game-container">
    <h1>📊 Your MantaMind Dashboard</h1>
    <div id="dashboard-summary">
      <p><strong>Username:</strong> <span id="user-name"></span></p>
      <p><strong>Learned Words:</strong> <span id="learned-count"></span></p>
      <p><strong>In Progress Words:</strong> <span id="inprogress-count"></span></p>
      <p><strong>Accuracy:</strong> <span id="db-accuracy">0%</span></p>
      <p><strong>Missed Words:</strong> <span id="db-missed">0</span></p>
      <p><strong>Perfect Days:</strong> <span id="db-perfect">0</span></p>
      <p><strong>Death Trap Best:</strong> <span id="db-deathbest">—</span></p>
    </div>

    <div id="word-lists">
      <h2>✅ Learned Words</h2>
      <ul id="learned-list"></ul>

      <h2>🔄 In Progress Words</h2>
      <ul id="inprogress-list"></ul>
    </div>
  </main>

  <script>
    // 🍔 Burger Menu Toggle
    document.getElementById('burger-btn').addEventListener('click', () => {
      document.getElementById('sidebar-menu').classList.toggle('hidden');
    });

    // 🚪 Logout Button
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('currentUser');
      localStorage.removeItem('userData');
      location.href = 'index.html';
    });

    // 📊 Load and Display User Progress
    const currentUser = localStorage.getItem('currentUser');
    const userData = JSON.parse(localStorage.getItem('userData') || '{}');

    if (!currentUser || !userData[currentUser]) {
      document.body.innerHTML = "<h2 style='text-align:center;'>Please log in first.</h2>";
    } else {
      const user = userData[currentUser];
      document.getElementById('user-name').textContent = currentUser;
      document.getElementById('learned-count').textContent = user.learnedWords.length;
      document.getElementById('inprogress-count').textContent = user.inProgressWords.length;
      // extra stats
      const totC = user.stats?.totalCorrect || 0;
      const totI = user.stats?.totalIncorrect || 0;
      const acc = totC + totI > 0 ? Math.round((totC/(totC+totI))*100) : 0;
      document.getElementById('db-accuracy').textContent = acc + '%';
      document.getElementById('db-missed').textContent = (user.missedWords || []).length;
      document.getElementById('db-perfect').textContent = user.stats?.perfectDays || 0;
      document.getElementById('db-deathbest').textContent = user.stats?.deathTrapBest ? user.stats.deathTrapBest : '—';

      const learnedList = document.getElementById('learned-list');
      const inprogressList = document.getElementById('inprogress-list');

      user.learnedWords.forEach(word => {
        const li = document.createElement('li');
        li.textContent = word;
        learnedList.appendChild(li);
      });

      user.inProgressWords.forEach(word => {
        const li = document.createElement('li');
        li.textContent = word;
        inprogressList.appendChild(li);
      });
    }
  </script>
</body>
</html>
